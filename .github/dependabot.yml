# Avisa (com um pedido de alteração) quando uma biblioteca tem uma versão nova ou uma falha de segurança conhecida.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
