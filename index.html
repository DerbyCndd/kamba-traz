<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kamba Traz</title>
<meta name="description" content="Envia encomendas entre Portugal e Angola, nos dois sentidos, com viajantes verificados. Pagamento em garantia até à entrega.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cartão de embarque. Cada viagem é um bilhete, cada pedido é uma etiqueta de mala.
   Cor: tinta azul-petróleo, papel de aeroporto, vermelho de Angola como único acento, amarelo só na etiqueta. */
:root{
  --paper:#EBEFF2; --card:#FFFFFF; --ink:#0F1A24; --muted:#4F5E6B; --line:#C9D2DA;
  --red:#B8261E; --on-red:#FFFFFF; --sun:#F0B323; --on-sun:#1B1500;
  --ok:#1B6B44; --ok-bg:#DDF1E6; --warn:#7A5300; --warn-bg:#FBEBC4; --bad:#9B1C1C; --bad-bg:#F8D9D6; --info:#1F4E79; --info-bg:#DCE9F5;
  --f-display:"Familjen Grotesk","Segoe UI",Arial,sans-serif;
  --f-body:"Public Sans","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1117; --card:#141D26; --ink:#E8EDF1; --muted:#95A3AF; --line:#28343F;
  --red:#F0675C; --on-red:#1A0B09; --sun:#F0B323; --on-sun:#1B1500;
  --ok:#6FD3A0; --ok-bg:#12301F; --warn:#F0C766; --warn-bg:#352906; --bad:#F59A94; --bad-bg:#3A1513; --info:#8EC1F0; --info-bg:#122535;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1117; --card:#141D26; --ink:#E8EDF1; --muted:#95A3AF; --line:#28343F;
  --red:#F0675C; --on-red:#1A0B09; --sun:#F0B323; --on-sun:#1B1500;
  --ok:#6FD3A0; --ok-bg:#12301F; --warn:#F0C766; --warn-bg:#352906; --bad:#F59A94; --bad-bg:#3A1513; --info:#8EC1F0; --info-bg:#122535;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1;letter-spacing:-.01em}
h1{font-size:clamp(30px,6.2vw,52px);font-weight:700}
h2{font-size:clamp(22px,3.6vw,30px);font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
a{color:inherit}
.mono{font-family:var(--f-mono)}
.label{font:500 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding:16px 0 12px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 22px/1 var(--f-display)}
.tag{width:26px;height:26px;background:var(--sun);border:2px solid var(--ink);border-radius:4px 4px 4px 12px;position:relative;flex:none}
.tag::after{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;max-width:100%;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 12px;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav a[aria-current="page"]{border-bottom-color:var(--red)}
nav a:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.conn{font:500 11px var(--f-mono);color:var(--muted);padding:6px 0 0;min-height:22px}

main{padding-top:28px;display:flex;flex-direction:column;gap:40px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:2px solid var(--ink);background:var(--card);color:var(--ink);
  font:600 15px var(--f-body);text-decoration:none;cursor:pointer;border-radius:6px}
.btn:hover{background:color-mix(in srgb,var(--ink) 8%,var(--card))}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding-top:8px}
.hero .copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero .lead{font-size:17px;max-width:52ch;color:var(--muted)}
.counts{display:flex;gap:22px;flex-wrap:wrap}
.counts b{display:block;font:700 28px/1 var(--f-display)}

/* bilhete */
.pass{background:var(--card);border:2px solid var(--ink);border-radius:10px;display:grid;grid-template-columns:1fr auto;min-width:0;overflow:hidden}
.pass .main{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pass .stub{padding:14px 16px;border-left:2px dashed var(--ink);display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:132px;background:color-mix(in srgb,var(--sun) 16%,var(--card))}
.route{display:flex;align-items:center;gap:10px;font:700 34px/1 var(--f-display);letter-spacing:.02em}
.route .line{flex:1;height:0;border-top:2px dotted var(--ink);position:relative;min-width:24px}
.route .line::after{content:"✈";position:absolute;right:-2px;top:-14px;font-size:18px;background:var(--card);padding-left:3px}
.city{font:500 12px var(--f-mono);color:var(--muted);margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts b{font:600 15px var(--f-mono)}
.stub b.big{font:700 22px/1.1 var(--f-display)}

/* etiqueta (pedido) */
.bagtag{background:var(--card);border:2px solid var(--ink);border-radius:6px 6px 6px 26px;padding:14px 16px 14px 18px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.bagtag::before{content:"";position:absolute;left:8px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--sun);border:1.5px solid var(--ink)}
.bagtag .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-left:8px}
.bagtag h3{overflow-wrap:anywhere}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px}
.grid.tags{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}

.pill{display:inline-block;font:600 11px/1 var(--f-mono);padding:5px 8px;border-radius:99px;letter-spacing:.04em;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}

/* painéis */
.panel{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.flat{border-width:1px;border-color:var(--line)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0;border:2px solid var(--ink);border-radius:8px;background:var(--card)}
.steps>div{padding:18px;display:flex;flex-direction:column;gap:8px;border-right:1px dashed var(--ink);border-bottom:1px dashed var(--ink);margin:-1px -1px 0 0}
.steps .n{font:600 12px var(--f-mono);color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* formulários */
form{display:flex;flex-direction:column;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label,.lab{font-weight:600;font-size:14px}
input,select,textarea{font:400 16px var(--f-body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:90px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:22px;min-height:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--red)}
.notice{border-left:5px solid var(--sun);background:color-mix(in srgb,var(--sun) 18%,var(--card));padding:12px 14px;border-radius:0 6px 6px 0;font-size:14px}
.notice.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.ref{font:600 26px var(--f-mono);letter-spacing:.08em;background:var(--paper);border:2px dashed var(--ink);padding:10px 14px;display:inline-block;overflow-wrap:anywhere}
.empty{border:2px dashed var(--line);border-radius:8px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty h3{color:var(--ink)}

/* calculadora */
.calc{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:end}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sum div{background:var(--paper);padding:12px;border-radius:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sum b{font:600 18px var(--f-mono);overflow-wrap:anywhere}

/* abas */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.tabs button{font:600 14px var(--f-body);background:none;border:2px solid transparent;border-bottom:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-radius:6px 6px 0 0;margin-bottom:-2px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;margin-left:6px;opacity:.85}

/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.stats>div{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stats b{font:700 24px/1.1 var(--f-display);overflow-wrap:anywhere}
.item{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 16px;font-size:14px}
.kv span{display:block;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.list{display:flex;flex-direction:column;gap:10px}
.tablewrap{overflow-x:auto}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .calc{grid-template-columns:1fr}
  .sum{grid-template-columns:1fr}
  .pass{grid-template-columns:1fr}
  .pass .stub{border-left:none;border-top:2px dashed var(--ink);flex-direction:row;align-items:center;flex-wrap:wrap}
  .route{font-size:28px}
  nav{margin-left:0;width:100%}
}
:root{--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:10px 14px;z-index:20;border-radius:6px;font-weight:600}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}
main:focus{outline:none}
.faq{display:flex;flex-direction:column;gap:8px}
.faq details{border:1px solid var(--line);background:var(--card);border-radius:8px}
.faq summary{cursor:pointer;padding:12px 16px;font-weight:600;min-height:44px;display:flex;align-items:center}
.faq details[open] summary{border-bottom:1px solid var(--line)}
.faq details p{padding:12px 16px;color:var(--muted)}
.code{font:400 13px/1.5 var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;overflow-x:auto;margin:0;white-space:pre;color:var(--ink)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.brow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:4px 12px;align-items:center;padding:6px 0}
.brow .nm{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.btracks{display:flex;flex-direction:column;gap:3px;min-width:0}
.btrack{display:flex;align-items:center;gap:8px;min-width:0}
.bfillw{flex:1;min-width:0}
.bfill{height:12px;border-radius:0 4px 4px 0;min-width:2px}
.bval{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.rtbl{width:100%;border-collapse:collapse;font-size:14px}
.rtbl th,.rtbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rtbl td.num,.rtbl th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.econ{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.ln{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln b{font-family:var(--f-mono);text-align:right}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.msg{display:flex;flex-direction:column;gap:8px}
.msg textarea{font-size:14px;min-height:110px}
@media (max-width:760px){.econ{grid-template-columns:1fr}.brow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .15s,filter .15s}}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar para o conteúdo</a>
<div class="wrap">
  <header>
    <div class="top">
      <a class="brand" href="#inicio" aria-label="Kamba Traz, início"><span class="tag" aria-hidden="true"></span>Kamba Traz</a>
      <nav id="nav" aria-label="Principal"></nav>
    </div>
    <div class="conn" id="conn" role="status"></div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>

<script>
(function(){
"use strict";

/* ---------- dados de referência ---------- */
const CITY={LIS:"Lisboa",OPO:"Porto",FAO:"Faro",GRU:"São Paulo",DXB:"Dubai",JNB:"Joanesburgo",CDG:"Paris",LHR:"Londres",
  LAD:"Luanda",BUG:"Benguela",SDD:"Lubango",NOV:"Huambo",CAB:"Cabinda",OTH:"Outra cidade"};
const PT=["LIS","OPO","FAO"],AO=["LAD","BUG","SDD","NOV","CAB"];
const FROM=PT.concat(AO);
const other=c=>PT.includes(c)?AO:PT;
function linkRoute(from,to){from.addEventListener("change",()=>{const t=other(from.value);to.replaceChildren(...opts(t,t[0]));});}
const CATS=["Roupa e calçado","Electrónicos (telemóvel, portátil, acessórios)","Cosméticos e higiene","Peças e ferramentas","Documentos e papelada","Medicamentos com receita","Brinquedos e artigos de bebé","Outro item legal"];
const DEAL_STEPS=[["negociacao","Em negociação"],["garantia","Pago · em garantia"],["transito","Em trânsito"],["entregue","Entregue"],["liberado","Pago ao viajante"]];
const ROUTES=["inicio","quadro","pedir","viajar","regras","meus","admin"];

/* ---------- estado ---------- */
const S={db:null,uid:null,isAdmin:false,canWrite:null,
  trips:[],requests:[],inbox:[],handled:[],deals:[],
  config:{commission:12,perKg:8000,whatsapp:""},
  ready:{},err:null,mine:[],eco:null,route:"inicio",adminTab:"entradas",boardTab:"viagens",boardFrom:"",calcKg:5};

/* ---------- utilitários ---------- */
const $=s=>document.querySelector(s);
function h(tag,attrs){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==="class")e.className=v; else if(k==="text")e.textContent=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,""); else e.setAttribute(k,v);}
  for(let i=2;i<arguments.length;i++){const c=arguments[i];
    (Array.isArray(c)?c:[c]).forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)));});}
  return e;
}
let nf;try{nf=new Intl.NumberFormat("pt-PT",{useGrouping:"always"});}catch(e){nf=new Intl.NumberFormat("pt-PT");}
const kz=n=>nf.format(Math.round(Number(n)||0))+" Kz";
function fdate(iso){if(!iso)return"";const d=new Date(iso+"T00:00:00");return isNaN(d)?iso:d.toLocaleDateString("pt-PT",{day:"numeric",month:"short"});}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
const firstName=n=>String(n||"").trim().split(/\s+/)[0]||"—";
const cityName=c=>CITY[c]||c;
function uid8(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function digits(s){return String(s||"").replace(/\D/g,"");}
function waLink(num,text){const d=digits(num);return d?"https://wa.me/"+d+(text?"?text="+encodeURIComponent(text):""):null;}
function copy(text,btn){
  const done=()=>{const o=btn.textContent;btn.textContent="Copiado";setTimeout(()=>btn.textContent=o,1500);};
  try{navigator.clipboard.writeText(text).then(done,()=>btn.textContent="Seleccione e copie");}catch(e){btn.textContent="Seleccione e copie";}
}
function opts(codes,sel){return codes.map(c=>h("option",{value:c,selected:c===sel},cityName(c)+(c!=="OTH"?" ("+c+")":"")));}
function field(id,label,control,hint,full){
  return h("div",{class:"field"+(full?" full":"")},h("label",{for:id},label),control,hint?h("span",{class:"hint",id:id+"-h"},hint):null,h("span",{class:"err",id:id+"-e",role:"alert"}));
}
function setErr(id,msg){
  const e=$("#"+id+"-e");if(e)e.textContent=msg||"";
  if(!msg){S._f=false;return;}
  if(!S._f){S._f=true;const el=$("#"+id);if(el&&el.focus)el.focus();}
}
function twoStep(label,onGo,cls){
  const b=h("button",{type:"button",class:"btn small "+(cls||"danger")},label);
  let armed=false,t;
  b.addEventListener("click",()=>{
    if(!armed){armed=true;b.textContent="Confirmar?";t=setTimeout(()=>{armed=false;b.textContent=label;},3500);}
    else{clearTimeout(t);armed=false;b.textContent=label;onGo();}
  });
  return b;
}
const openTrips=()=>S.trips.filter(t=>t.status!=="concluida"&&(!t.date||t.date>=today())).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
const openReqs=()=>S.requests.filter(r=>r.status==="aberto").sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

/* ---------- ligação à base de dados ---------- */
let rerenderTimer;
function refresh(force){
  const m=$("#main"),a=document.activeElement;
  if(!force){
    if(S.route==="pedir"||S.route==="viajar")return;
    if(a&&m.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  }
  clearTimeout(rerenderTimer);
  rerenderTimer=setTimeout(render,30);
}
function listen(name,key,map){
  const timer=setTimeout(()=>{if(!S.ready[key]){S.err="lento";conn();}},10000);
  S.db.collection(name).onSnapshot(snap=>{
    clearTimeout(timer);
    S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(map)S[key]=map(S[key]);
    S.ready[key]=true;if(S.err==="lento")S.err=null;conn();refresh();
  },e=>{clearTimeout(timer);S.err=e&&e.code||"erro";S.ready[key]=true;conn();refresh();});
}
function conn(){
  const c=$("#conn");
  if(!S.db)c.textContent="Modo de leitura local: a base de dados não está disponível nesta vista.";
  else if(S.err==="lento")c.textContent="A base de dados está lenta a responder. Os dados podem estar desactualizados.";
  else if(S.err)c.textContent="Sem acesso a alguns dados ("+S.err+").";
  else c.textContent="";
}
async function boot(){
  render();
  let user=null;
  try{user=await claude.use("user");}catch(e){}
  if(user){
    try{S.isAdmin=await user.canEdit();}catch(e){}

async function submitInbox(kind,data){

const pct=(a,b)=>b?Math.round(a/b*100)+"%":"–";
function adminAnalysis(){
  const subs=S.inbox.reduce((a,d)=>a+(Array.isArray(d.items)?d.items.length:0),0);
  const approved=S.handled.filter(x=>x.action==="approved").length;
  const linked=S.deals.length,done=S.deals.filter(d=>d.status==="liberado").length;
  const steps=[["Entradas recebidas",subs],["Aprovadas e publicadas",approved],["Ligadas a viajante",linked],["Entregas concluídas",done]];
  const mx=Math.max(1,...steps.map(s=>s[1]));

    h("div",{class:"nm"},s[0]),

      h("span",{class:"bval"},s[1]+(i?" · "+pct(s[1],steps[i-1][1])+" do passo anterior":"")))));
  const m={};
  openTrips().forEach(t=>{const k=t.from+" → "+t.to;(m[k]=m[k]||{s:0,d:0}).s+=Number(t.kg)||0;});
  openReqs().forEach(r=>{const k=r.from+" → "+r.to;(m[k]=m[k]||{s:0,d:0}).d+=Number(r.kg)||0;});
  const rows=Object.keys(m).map(k=>({k,s:m[k].s,d:m[k].d,gap:m[k].d-m[k].s})).sort((a,b)=>Math.max(b.s,b.d)-Math.max(a.s,a.d));
  const rmx=Math.max(1,...rows.map(r=>Math.max(r.s,r.d)));
  const tr=(label,v,color)=>h("div",{class:"btrack",title:label+": "+v+" kg"},h("div",{class:"bfillw"},h("div",{class:"bfill",style:"width:"+(v/rmx*100)+"%;background:"+color})),h("span",{class:"bval"},v+" kg"));

  }

  const kpi=h("div",{class:"stats"},
    h("div",null,h("span",{class:"label"},"Taxa de aprovação"),h("b",null,pct(approved,subs))),
    h("div",null,h("span",{class:"label"},"Conversão até entrega"),h("b",null,pct(done,subs))),
    h("div",null,h("span",{class:"label"},"Valor médio por entrega"),h("b",null,avg?kz(avg):"–")));
  const table=h("details",null,h("summary",{style:"cursor:pointer;font-weight:600;min-height:36px"},"Ver como tabela"),
    h("div",{class:"tablewrap"},h("table",{class:"rtbl"},h("thead",null,h("tr",null,h("th",null,"Rota"),h("th",{class:"num"},"Espaço (kg)"),h("th",{class:"num"},"Procura (kg)"),h("th",{class:"num"},"Diferença"))),
      h("tbody",null,rows.map(r=>h("tr",null,h("td",null,r.k),h("td",{class:"num"},r.s),h("td",{class:"num"},r.d),h("td",{class:"num"},(r.gap>0?"+":"")+r.gap)))))));
  return h("div",{class:"list"},
    kpi,
    h("div",{class:"panel"},h("h3",null,"Do primeiro contacto à entrega"),h("p",{class:"hint"},"Onde perdes pessoas pelo caminho."),h("div",{role:"img","aria-label":"Funil: "+steps.map(s=>s[0]+" "+s[1]).join(", ")},funnel)),
    h("div",{class:"panel"},h("h3",null,"Espaço dos viajantes contra procura, por rota"),
      h("p",{class:"notice"},insight),
      rows.length?[h("div",{class:"legend"},h("span",null,h("i",{class:"sw",style:"background:var(--s1)"}),"Espaço dos viajantes"),h("span",null,h("i",{class:"sw",style:"background:var(--s2)"}),"Procura dos pedidos")),
        h("div",{role:"img","aria-label":"Espaço e procura em kg por rota. "+insight},chart),table]
        :h("div",{class:"empty"},h("p",null,"Quando houver viagens e pedidos abertos, vês aqui onde falta espaço e onde sobra. Usa “Carregar exemplos” no separador Quadro para ver como fica."))));

function adminEconomics(){

      E.courier>0?h("p",{class:"hint"},"O cliente paga "+kz(E.perKg)+"/kg contra "+kz(E.courier)+"/kg no correio expresso: "+(save>0?"poupa "+save+"%.":"não poupa.")):null,
      h("h3",null,"Cenários"),
      h("div",{class:"tablewrap"},h("table",{class:"rtbl"},h("thead",null,h("tr",null,h("th",{class:"num"},"Entregas/mês"),h("th",{class:"num"},"Comissão"),h("th",{class:"num"},"Lucro"))),
        h("tbody",null,[10,30,60,100,200].map(n=>{const x=calc(n);return h("tr",null,h("td",{class:"num"},n),h("td",{class:"num"},kz(x.rev)),h("td",{class:"num "+(x.profit>=0?"pos":"neg")},kz(x.profit)));})))));
  }

function adminTech(){
  const sql1="create table profiles (\n  id uuid primary key references auth.users,\n  full_name text not null,\n  role text not null default 'user' check (role in ('user','admin')),\n  verified_at timestamptz\n);\n\ncreate table private_contacts (\n  user_id uuid primary key references profiles(id),\n  phone text not null\n);\n\ncreate table trips (\n  id uuid primary key default gen_random_uuid(),\n  traveler_id uuid not null references profiles(id),\n  origin text not null,\n  destination text not null,\n  travel_date date not null,\n  kg_free numeric not null check (kg_free > 0),\n  price_per_kg_aoa integer not null check (price_per_kg_aoa >= 0),\n  status text not null default 'pending',\n  created_at timestamptz not null default now()\n);\ncreate index on trips (status, origin, destination, travel_date);";
  const sql2="alter table trips enable row level security;\n\ncreate policy trips_public_read on trips\n  for select using (status = 'open');\n\ncreate policy trips_owner_insert on trips\n  for insert with check (auth.uid() = traveler_id);\n\ncreate policy trips_admin_all on trips\n  for all using (\n    exists (select 1 from profiles p\n            where p.id = auth.uid() and p.role = 'admin'));\n\nalter table private_contacts enable row level security;\ncreate policy contacts_owner on private_contacts\n  for all using (auth.uid() = user_id);";
  const flow="pending → open → matched → paid_escrow → in_transit\n                                      ↓\n                               delivered → released\n\nqualquer estado antes de released → cancelled / disputed";
  const ul=a=>h("ul",{style:"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"},a.map(x=>h("li",null,x)));
  return h("div",{class:"list"},
    h("div",{class:"notice"},"Este separador é o desenho para passar do protótipo a produção. Nada daqui está ligado ainda: o protótipo usa a base de dados do artefacto."),
    h("div",{class:"two"},
      h("div",{class:"panel"},h("h3",null,"Stack"),ul(["Next.js (Route Handlers) no mesmo projecto do site","Supabase: Postgres, autenticação e Row Level Security","Vercel para o site e a API; segredos em variáveis de ambiente","Fornecedor de pagamentos com Multicaixa Express, Unitel Money ou referência, a confirmar qual está disponível para o teu caso"])),
      h("div",{class:"panel"},h("h3",null,"Rotas da API"),ul(["POST /api/requests e POST /api/trips: validam no servidor e gravam como pending","POST /api/admin/approve: só admin, com sessão verificada no servidor","POST /api/deals: cria a entrega e o registo de pagamento","POST /api/payments/webhook: verifica assinatura e usa chave de idempotência","POST /api/deals/:id/confirm: valida o código de entrega e liberta o pagamento"]))),
    h("div",{class:"panel"},h("h3",null,"Estados de uma entrega"),h("pre",{class:"code"},flow),
      ul(["Cada mudança de estado grava uma linha num registo de auditoria (quem, quando, de onde para onde)","O código de entrega guarda-se só como hash; nunca em texto simples","Libertar o pagamento só é possível a partir de delivered"])),
    h("div",{class:"panel"},h("h3",null,"Tabelas principais"),h("pre",{class:"code"},sql1)),
    h("div",{class:"panel"},h("h3",null,"Segurança com RLS"),h("p",{class:"hint"},"O público só lê viagens abertas. Contactos e entregas ficam privados."),h("pre",{class:"code"},sql2)),
    h("div",{class:"panel"},h("h3",null,"Antes de abrir ao público"),ul(["RLS activo e testado em todas as tabelas","Nenhuma chave secreta no código do browser (a service_role só no servidor)","Toda a escrita validada no servidor, com limites de tamanho","Rate limiting nos formulários e no login","Listagens paginadas e índices nos filtros por rota e data","Termos de uso e política de privacidade revistos por um advogado, sobretudo a parte de transporte de bens e dados pessoais"])));
}

/* ---------- navegação ---------- */
function render(){
  const r=(location.hash||"#inicio").slice(1);
  S.route=ROUTES.includes(r)?r:"inicio";
  const nav=$("#nav");nav.replaceChildren();
  [["inicio","Início"],["quadro","Quadro"],["pedir","Pedir envio"],["viajar","Vou viajar"],["regras","Regras"]].concat(S.uid?[["meus","Os meus"]]:[]).concat(S.isAdmin?[["admin","Equipa"]]:[]).forEach(x=>{
    nav.append(h("a",{href:"#"+x[0],"aria-current":S.route===x[0]?"page":null},x[1]));});
  const main=$("#main");
  let v;try{v=views[S.route]();}catch(e){v=h("div",{class:"notice bad"},"Ocorreu um erro ao mostrar esta página.");console.error(e);}
  main.replaceChildren.apply(main,Array.isArray(v)?v:[v]);
}
let lastRoute="";
window.addEventListener("hashchange",()=>{render();if(lastRoute!==S.route){window.scrollTo(0,0);lastRoute=S.route;try{$("#main").focus({preventScroll:true});}catch(e){}}});
lastRoute=(location.hash||"#inicio").slice(1);
boot();
})();
</script>
